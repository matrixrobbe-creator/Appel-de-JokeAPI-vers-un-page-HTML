<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBO - Générateur de Blagues Offcielles mais pas trop non plus</title>
    <!-- Micro-framework CSS Chota -->
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <!-- Police style BD / Rétro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <main class="container">
        <!-- Zone du titre ainsi que des commandes à disposition de l'utilisateur -->
        <section class="card comic-box text-center">
            <h1 class="comic-title">Générateur de Blagues Officielles mais pas trop non plus</h1>
            <p class="comic-subtitle">Le générateur officiel des blagues du niveau Carambar mais sans acheter de Carambar</p>

            <div class="row comic-controls">
                <div class="col-6 col-md-3">
                    <button id="btn-ajouter" class="button primary comic-btn w-100">Nouvelle blague</button>
                </div>
                <div class="col-6 col-md-4">
                    <button id="btn-vider" class="button error comic-btn w-100">Vider le tableau</button>
                </div>
            </div>
        </section>

        <!-- Tableau d'affichage des blagues -->
        <section class="card comic-box">
            <table class="striped comic-table">
                <thead>
                    <tr>
                        <th style="width: 25%;">Catégorie</th>
                        <th style="width: 60%;">Blague</th>
                        <th style="width: 15%; text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody id="tableau-corps">
                    <!-- Rempli par JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="/assets/js/script.js"></script>
</body>
</html>
